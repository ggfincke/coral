[project]
name = "coral-backend"
version = "0.1.0"
description = "Coral-owned MLX inference worker over the versioned stdio protocol"
requires-python = ">=3.14"
dependencies = [
    "mlx==0.32.0",
    "mlx-lm==0.31.3",
    "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coral_backend"]

[tool.uv]
package = true
