[project]
name = "coral-plugins"
version = "0.1.0"
description = "Local MCP plugin host for authoring Coral tools in Python"
requires-python = ">=3.14"
dependencies = [
    "mcp~=2.0",
    "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coral_plugins"]

[tool.uv]
package = true
